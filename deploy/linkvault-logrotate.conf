/var/log/linkvault/application.log {
    daily
    # Authentication risk events are privacy-sensitive; keep this application log to seven daily rotations.
    rotate 7
    maxage 7
    size 10M
    missingok
    notifempty
    compress
    delaycompress
    create 0640 www-data www-data
    su www-data www-data
}

/var/log/linkvault/nginx-linkvault-analytics.log {
    daily
    rotate 30
    missingok
    notifempty
    nocompress
    create 0640 www-data adm
    sharedscripts
    postrotate
        if [ -r /run/nginx.pid ]; then
            kill -USR1 "$(cat /run/nginx.pid)" 2>/dev/null || true
        fi
    endscript
}

/var/log/linkvault/caddy-linkvault-analytics.log {
    daily
    rotate 30
    missingok
    notifempty
    nocompress
    create 0640 caddy adm
    sharedscripts
    postrotate
        systemctl reload caddy.service >/dev/null 2>&1 || true
    endscript
}

/var/log/nginx/linkvault-endpoints.log /var/log/nginx/linkvault-endpoints-error.log /var/log/nginx/linkvault-performance.log /var/log/nginx/linkvault-static.log {
    daily
    # Endpoint logs contain no client addresses, headers, or query strings; retain at most 30 days.
    rotate 30
    maxage 30
    missingok
    notifempty
    compress
    delaycompress
    create 0640 www-data adm
    sharedscripts
    postrotate
        if [ -r /run/nginx.pid ]; then
            kill -USR1 "$(cat /run/nginx.pid)" 2>/dev/null || true
        fi
    endscript
}

/var/log/nginx/linkvault-security.log {
    daily
    # This separate anti-abuse log contains source IPs for Fail2ban, never analytics fields.
    rotate 7
    maxage 7
    missingok
    notifempty
    compress
    delaycompress
    create 0640 root adm
}
