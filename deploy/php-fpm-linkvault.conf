[linkvault]
user = www-data
group = www-data

listen = /run/php/php8.5-fpm-linkvault.sock
listen.owner = www-data
listen.group = www-data
listen.mode = 0660

pm = dynamic
pm.max_children = 10
pm.start_servers = 2
pm.min_spare_servers = 1
pm.max_spare_servers = 3
pm.max_requests = 500

clear_env = yes
env[LINKVAULT_ENV] = $LINKVAULT_ENV
env[LINKVAULT_ADMIN_PASSWORD] = $LINKVAULT_ADMIN_PASSWORD
env[LINKVAULT_BASE_URL] = $LINKVAULT_BASE_URL
