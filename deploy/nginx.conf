map $request_uri $linkvault_login_ip_key {
    default "";
    ~^/login(?:\?|$) $binary_remote_addr;
}

map $request_uri $linkvault_login_global_key {
    default "";
    ~^/login(?:\?|$) login;
}

map "$request_method:$uri" $linkvault_unlock_ip_key {
    default "";
    "~^POST:/[A-Za-z0-9_-]{3,64}/unlock$" $binary_remote_addr;
}

map "$request_method:$uri" $linkvault_unlock_global_key {
    default "";
    "~^POST:/[A-Za-z0-9_-]{3,64}/unlock$" link_unlock;
}

map "$request_method:$uri" $linkvault_redirect_ip_key {
    default "";
    "~^(?:GET|HEAD):/[A-Za-z0-9_-]{3,64}$" $binary_remote_addr;
}

map "$request_method:$uri" $linkvault_redirect_global_key {
    default "";
    "~^(?:GET|HEAD):/[A-Za-z0-9_-]{3,64}$" redirect;
}

map "$request_method:$uri" $linkvault_api_ip_key {
    default "";
    "~^[^:]+:/api/" $binary_remote_addr;
}

map "$request_method:$uri" $linkvault_api_global_key {
    default "";
    "~^[^:]+:/api/" linkvault_api;
}

map "$request_method:$uri" $linkvault_ready_ip_key {
    default "";
    "~^(?:GET|HEAD):/readyz$" $binary_remote_addr;
}

map "$request_method:$uri" $linkvault_ready_global_key {
    default "";
    "~^(?:GET|HEAD):/readyz$" readiness;
}

map "$request_method:$uri" $linkvault_health_ip_key {
    default "";
    "~^(?:GET|HEAD):/healthz$" $binary_remote_addr;
}

map "$request_method:$uri" $linkvault_health_global_key {
    default "";
    "~^(?:GET|HEAD):/healthz$" operational_health;
}

map $uri $linkvault_endpoint_loggable {
    default 0;
    ~^/api/ 1;
    /readyz 1;
    /healthz 1;
}

map "$request_method:$uri:$arg_section:$arg_q" $linkvault_performance_route {
    default "";
    ~^(?:GET|HEAD):/:(?:|links):$ admin_list;
    ~^(?:GET|HEAD):/:(?:|links):.+$ search;
    ~^(?:GET|HEAD):/:analytics: analytics_report;
    ~^(?:GET|POST):/export-links:: link_export;
    "GET:/export-analytics::" analytics_export;
    ~^(?:GET|HEAD):/[A-Za-z0-9_-]{3,64}::$ redirect;
}

map "$request_method:$uri" $linkvault_login_loggable {
    default 0;
    "POST:/login" 1;
    "~^POST:/[A-Za-z0-9_-]{3,64}/unlock$" 1;
}

map "$request_method:$uri" $linkvault_analytics_loggable {
    default 0;
    "~^(?:GET|HEAD):/[A-Za-z0-9_-]{3,64}$" 1;
    "~^POST:/[A-Za-z0-9_-]{3,64}/confirm$" 1;
}

map $http_referer $linkvault_analytics_referrer_domain {
    default "";
    ~*^https?://([^/:?#]+) $1;
}

map $limit_req_status $linkvault_retry_after {
    default "";
    REJECTED 1;
    REJECTED_DRY_RUN 1;
}

limit_req_zone $linkvault_login_ip_key zone=linkvault_login_ip:10m rate=6r/m;
limit_req_zone $linkvault_login_global_key zone=linkvault_login_global:1m rate=30r/m;
limit_req_zone $linkvault_unlock_ip_key zone=linkvault_unlock_ip:10m rate=10r/m;
limit_req_zone $linkvault_unlock_global_key zone=linkvault_unlock_global:1m rate=100r/m;
limit_req_zone $linkvault_redirect_ip_key zone=linkvault_redirect_ip:10m rate=20r/s;
limit_req_zone $linkvault_redirect_global_key zone=linkvault_redirect_global:1m rate=200r/s;
limit_req_zone $linkvault_api_ip_key zone=linkvault_api_ip:10m rate=30r/m;
limit_req_zone $linkvault_api_global_key zone=linkvault_api_global:1m rate=300r/m;
limit_req_zone $linkvault_ready_ip_key zone=linkvault_ready_ip:10m rate=60r/m;
limit_req_zone $linkvault_ready_global_key zone=linkvault_ready_global:1m rate=600r/m;
limit_req_zone $linkvault_health_ip_key zone=linkvault_health_ip:10m rate=30r/m;
limit_req_zone $linkvault_health_global_key zone=linkvault_health_global:1m rate=300r/m;
limit_conn_zone $binary_remote_addr zone=linkvault_per_ip:10m;
limit_conn_zone $server_name zone=linkvault_server:1m;

log_format linkvault_endpoint_json escape=json
    '{"time":"$time_iso8601","request_id":"$request_id",'
    '"method":"$request_method","uri":"$uri","status":$status,'
    '"request_time":$request_time,"upstream_time":"$upstream_response_time",'
    '"limit_status":"$limit_req_status","bytes_sent":$bytes_sent}';

log_format linkvault_performance_json escape=json
    '{"time":"$time_iso8601","request_id":"$request_id","route":"$linkvault_performance_route",'
    '"status":$status,"request_time":$request_time,"upstream_time":"$upstream_response_time",'
    '"bytes_sent":$bytes_sent}';

log_format linkvault_static_json escape=json
    '{"time":"$time_iso8601","status":$status,"request_time":$request_time,'
    '"bytes_sent":$bytes_sent,"encoding":"$sent_http_content_encoding"}';

log_format linkvault_security '$remote_addr - - "$request_method $uri $server_protocol" $status 0';

# This dedicated log intentionally omits IP addresses, cookies, query strings and full referrer URLs.
log_format linkvault_analytics_json escape=json
    '{"time":"$time_iso8601","method":"$request_method","uri":"$uri",'
    '"status":$status,"country":"$http_cf_ipcountry",'
    '"user_agent":"$http_user_agent","referrer_domain":"$linkvault_analytics_referrer_domain"}';

server {
    listen 80;
    listen [::]:80;
    # Keep this explicit allowlist synchronized with verified domains in LinkVault.
    server_name s.example.com go.example.com;

    if ($http_host !~* ^(?:s|go)\.example\.com(?::80)?$) { return 444; }
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name s.example.com go.example.com;

    ssl_certificate /etc/letsencrypt/live/s.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/s.example.com/privkey.pem;

    root /var/www/linkvault/public;
    index index.php;
    server_tokens off;
    client_max_body_size 3m;
    limit_conn linkvault_per_ip 20;
    limit_conn linkvault_server 100;
    limit_conn_status 429;
    limit_req zone=linkvault_login_ip burst=3 nodelay;
    limit_req zone=linkvault_login_global burst=10 nodelay;
    limit_req zone=linkvault_unlock_ip burst=5 nodelay;
    limit_req zone=linkvault_unlock_global burst=20 nodelay;
    limit_req zone=linkvault_redirect_ip burst=40 nodelay;
    limit_req zone=linkvault_redirect_global burst=100 nodelay;
    limit_req zone=linkvault_api_ip burst=10 nodelay;
    limit_req zone=linkvault_api_global burst=50 nodelay;
    limit_req zone=linkvault_ready_ip burst=10 nodelay;
    limit_req zone=linkvault_ready_global burst=100 nodelay;
    limit_req zone=linkvault_health_ip burst=5 nodelay;
    limit_req zone=linkvault_health_global burst=50 nodelay;
    limit_req_status 429;
    limit_req_log_level warn;
    add_header Retry-After $linkvault_retry_after always;
    access_log /var/log/nginx/linkvault-endpoints.log linkvault_endpoint_json if=$linkvault_endpoint_loggable;
    access_log /var/log/nginx/linkvault-performance.log linkvault_performance_json if=$linkvault_performance_route;
    access_log /var/log/linkvault/nginx-linkvault-analytics.log linkvault_analytics_json if=$linkvault_analytics_loggable;
    access_log /var/log/nginx/linkvault-security.log linkvault_security if=$linkvault_login_loggable;
    error_log /var/log/nginx/linkvault-endpoints-error.log warn;

    if ($http_host !~* ^(?:s|go)\.example\.com(?::443)?$) { return 444; }

    location ~* ^/assets/(fonts/)?[A-Za-z0-9_.-]+\.[0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f]\.(css|js|woff2|svg)$ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log /var/log/nginx/linkvault-static.log linkvault_static_json;
        gzip on;
        gzip_vary on;
        gzip_min_length 1024;
        gzip_comp_level 6;
        gzip_types text/css application/javascript image/svg+xml;
    }

    location ~* ^/assets/(fonts/)?[A-Za-z0-9_.-]+\.(css|js|woff2|svg)$ {
        try_files $uri =404;
        expires 1h;
        add_header Cache-Control "public, must-revalidate";
        access_log /var/log/nginx/linkvault-static.log linkvault_static_json;
        gzip on;
        gzip_vary on;
        gzip_min_length 1024;
        gzip_comp_level 6;
        gzip_types text/css application/javascript image/svg+xml;
    }

    location / {
        try_files $uri $uri/ /index.php$is_args$args;
    }

    location = /index.php {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root/index.php;
        fastcgi_param HTTP_PROXY "";
        fastcgi_param HTTP_HOST $http_host;
        fastcgi_param HTTPS $https if_not_empty;
        fastcgi_pass unix:/run/php/php8.5-fpm-linkvault.sock;
    }

    location ~ \.php$ {
        return 404;
    }

    location ~ /\. {
        return 404;
    }
}
