name: Release

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: pdo_sqlite, sqlite3, zip, mbstring, curl
          coverage: none
      - run: sudo apt-get update && sudo apt-get install -y sqlite3
      - run: composer install --no-interaction --prefer-dist
      - run: composer build:release -- build/LinkVault.zip
      - run: composer scan:release -- build/LinkVault.zip
      - name: Install and verify release
        shell: bash
        run: |
          set -euo pipefail
           unzip -q build/LinkVault.zip -d /tmp/linkvault-release
           cd /tmp/linkvault-release/LinkVault
           test -f browser-extension/manifest.json
           test -f browser-extension/icons/icon-16.png
           test -f browser-extension/icons/icon-32.png
           test -f browser-extension/icons/icon-48.png
           test -f browser-extension/icons/icon-128.png
           composer install --no-dev --no-interaction --prefer-dist
          export LINKVAULT_ADMIN_PASSWORD='release-verification-password-2026'
          export LINKVAULT_BASE_URL='http://127.0.0.1:18080'
          export LINKVAULT_DATABASE_PATH='/tmp/linkvault-runtime/linkvault.sqlite'
          export LINKVAULT_LOG_PATH='/tmp/linkvault-log/application.log'
          export LINKVAULT_BACKUP_DIR='/tmp/linkvault-backups'
          mkdir -p /tmp/linkvault-runtime /tmp/linkvault-log /tmp/linkvault-backups
          php bin/migrate.php
          php bin/backup.php
          php -S 127.0.0.1:18080 -t public public/router.php >/tmp/linkvault-server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          for attempt in {1..20}; do
            if curl --fail --silent --show-error http://127.0.0.1:18080/healthz > /tmp/healthz.json; then
              break
            fi
            sleep 0.5
          done
          curl --fail --silent --show-error http://127.0.0.1:18080/healthz
      - uses: actions/upload-artifact@v4
        with:
          name: LinkVault
          path: build/LinkVault.zip
          if-no-files-found: error
